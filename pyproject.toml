[project]
name = "runspace-agent"
version = "0.1.0"
description = "Sandboxed execution environment for AI agents operating on filesystem directories"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
]

[project.scripts]
runspace-srv = "runspace_agent.cli:main"

[project.optional-dependencies]
claude = ["claude-code-sdk>=0.0.25"]
container = ["docker>=7.0.0"]
server = ["fastapi>=0.104.0", "uvicorn[standard]>=0.24.0"]
examples = ["mcp>=1.0"]
all = ["runspace-agent[claude,container,server,examples]"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"runspace_agent" = ["_docker/Dockerfile"]
"runspace_agent.server" = ["static/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["examples", "skillberry-skill-maker-future-integration", "frontend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
